<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LedgerGift</title>
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="style.css?v=20260927h" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="topbar">
      <button class="brand" id="homeBtn" aria-label="Главная">
        <img src="assets/logo.png" alt="LedgerGift" class="brand-logo" />
        <span class="brand-name">LedgerGift</span>
      </button>
      <button id="langBtn" class="icon-btn" title="Language">🌐</button>
    </header>

    <!-- Main content mounts here -->
    <main id="view" class="view"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar">
      <button class="tab" data-route="balance"><span class="ic">💎</span><span class="lbl" data-i18n="nav_balance">Баланс</span></button>
      <button class="tab" data-route="security"><span class="ic">🛡️</span><span class="lbl" data-i18n="nav_security">Защита</span></button>
      <button class="tab tab-fab" data-route="home"><span class="ic">🏠</span><span class="lbl" data-i18n="nav_home">Главная</span></button>
      <button class="tab" data-route="top"><span class="ic">📊</span><span class="lbl" data-i18n="nav_top">Топ</span></button>
      <button class="tab" data-route="profile"><span class="ic">👤</span><span class="lbl" data-i18n="nav_profile">Профиль</span></button>
    </nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="i18n.js?v=20260927c"></script>
  <script src="app.js?v=20260927c"></script>
</body>
</html>
